plugins {
    id 'com.android.library'
}

android {
    namespace "org.example.visualanchors"
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DOpenCV_DIR=${file('../OpenCV-android-sdk/sdk/native/jni').absolutePath}"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'main/AndroidManifest.xml'
            java.srcDirs = ['main/java']
            jniLibs.srcDirs = ['main/jniLibs']
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    packagingOptions {
        resources { excludes += ["META-INF/*"] }
    }

    externalNativeBuild {
        cmake {
            path "main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    // Usa gli AAR dei template Godot presenti nella build Android principale
    compileOnly files('../../../../android/build/libs/debug/godot-lib.template_debug.aar',
            '../../../../android/build/libs/release/godot-lib.template_release.aar')
}
